name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run tlc
      - run: npm run g0
      - run: npm run gen:statechart
      - run: git diff --exit-code -- statechart.mmd
      - run: node --experimental-strip-types scripts/write-denylist.ts
      - run: npm run pii
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
